# =============================================================================
# Prometheus Configuration
# DDM501 - Lab 4: Monitoring & Production Deployment
# =============================================================================

global:
  # How frequently to scrape targets
  scrape_interval: 15s

  # How frequently to evaluate rules
  evaluation_interval: 15s

# Alertmanager configuration (optional - uncomment if you add an
# alertmanager service to docker-compose)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - targets: ['alertmanager:9093']

# Rule files for alerting
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # ==========================================================================
  # Prometheus self-monitoring
  # ==========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ==========================================================================
  # TODO 1: Movie Rating API scraping
  # ==========================================================================
  - job_name: 'movie-rating-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: movie-rating-api

  # ==========================================================================
  # TODO 2: Additional services (BONUS)
  # ==========================================================================
  # Node Exporter for host system metrics (CPU, memory, disk, network)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
